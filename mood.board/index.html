<!DOCTYPE html>
<html>
<head>
  <title>Mood Board</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body id="page">
  <div class="card">
    <h1>How are you feeling?</h1>
    <div class="moods">
      <button onclick="setMood('happy')">😊 Happy</button>
      <button onclick="setMood('tired')">😴 Tired</button>
      <button onclick="setMood('motivated')">🔥 Motivated</button>
      <button onclick="setMood('chill')">😌 Chill</button>
    </div>
    <p id="quote">Pick a mood to get a quote.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
